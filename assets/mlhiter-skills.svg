<svg width="100%" viewBox="0 0 1100 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">mlhiter skills overview</title>
  <desc id="svgDesc">A compact visual overview of all thirteen public skills in the mlhiter skills catalog.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1100" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbfaf6"/>
      <stop offset="1" stop-color="#eef4f2"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="560" fill="url(#paper)"/>

  <g transform="translate(70 58)">
    <circle cx="28" cy="28" r="26" fill="#18212d"/>
    <circle cx="19" cy="19" r="3.4" fill="#fbfaf6"/>
    <circle cx="37" cy="19" r="3.4" fill="#fbfaf6"/>
    <circle cx="19" cy="37" r="3.4" fill="#fbfaf6"/>
    <circle cx="37" cy="37" r="3.4" fill="#fbfaf6"/>
    <path d="M19 19C26 28 28 28 37 37" stroke="#fbfaf6" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <text x="150" y="80" fill="#27715e" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1">MLHITER/SKILLS</text>
  <text x="150" y="123" fill="#18212d" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">All skills at a glance</text>
  <text x="150" y="155" fill="#65727c" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Thirteen installable playbooks, grouped by the moment you need them.</text>

