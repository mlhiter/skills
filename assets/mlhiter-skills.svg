    <text x="453" y="24" text-anchor="middle" fill="#5a3f78" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">git-commit-push</text>
    <rect x="546" y="0" width="106" height="38" rx="10" fill="#f3eef8" stroke="#9b7bb6"/>
    <text x="599" y="24" text-anchor="middle" fill="#5a3f78" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">pr-creator</text>
