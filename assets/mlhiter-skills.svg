    <text x="22" y="35" fill="#18212d" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">skills.sh/mlhiter/skills</text>
  </g>

  <path d="M70 344H1030" stroke="#cbd6d2" stroke-width="1.2"/>
  <g transform="translate(70 366)">
    <text x="0" y="0" fill="#65727c" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Writing</text>
    <circle cx="78" cy="-4" r="3.5" fill="#d9873d"/>
    <text x="102" y="0" fill="#65727c" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Codex lifecycle</text>
    <circle cx="228" cy="-4" r="3.5" fill="#52997b"/>
    <text x="252" y="0" fill="#65727c" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">QA</text>
