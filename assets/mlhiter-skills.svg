<svg width="100%" viewBox="0 0 1100 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">mlhiter skills overview</title>
  <desc id="svgDesc">A simple visual overview of the public agent skill catalog: think, hunt, check, ship.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1100" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbfaf6"/>
      <stop offset="1" stop-color="#eef4f2"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="420" fill="url(#paper)"/>

  <g transform="translate(70 62)">
    <circle cx="28" cy="28" r="26" fill="#18212d"/>
    <circle cx="19" cy="19" r="3.4" fill="#fbfaf6"/>
    <circle cx="37" cy="19" r="3.4" fill="#fbfaf6"/>
    <circle cx="19" cy="37" r="3.4" fill="#fbfaf6"/>
    <circle cx="37" cy="37" r="3.4" fill="#fbfaf6"/>
    <path d="M19 19C26 28 28 28 37 37" stroke="#fbfaf6" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <text x="150" y="84" fill="#27715e" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1">MLHITER/SKILLS</text>
  <text x="150" y="126" fill="#18212d" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Reusable agent skills</text>
  <text x="150" y="158" fill="#65727c" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">A small public catalog for planning, debugging, reviewing, and shipping with evidence.</text>

  <g transform="translate(150 216)">
    <rect x="0" y="0" width="132" height="64" rx="10" fill="#eef2ff" stroke="#7b8ed8"/>
    <text x="66" y="29" text-anchor="middle" fill="#2d438f" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">think</text>
    <text x="66" y="48" text-anchor="middle" fill="#4b5c9b" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">decide first</text>

    <path d="M148 32H198" stroke="#9aaaa4" stroke-width="1.2" stroke-dasharray="5 8"/>

    <rect x="214" y="0" width="132" height="64" rx="10" fill="#e8f5ee" stroke="#52997b"/>
    <text x="280" y="29" text-anchor="middle" fill="#176548" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">hunt</text>
    <text x="280" y="48" text-anchor="middle" fill="#34775d" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">root cause</text>

    <path d="M362 32H412" stroke="#9aaaa4" stroke-width="1.2" stroke-dasharray="5 8"/>

    <rect x="428" y="0" width="132" height="64" rx="10" fill="#fff0df" stroke="#d9873d"/>
    <text x="494" y="29" text-anchor="middle" fill="#8d4f12" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">check</text>
    <text x="494" y="48" text-anchor="middle" fill="#9b642b" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">verify</text>

    <path d="M576 32H626" stroke="#9aaaa4" stroke-width="1.2" stroke-dasharray="5 8"/>

    <rect x="642" y="0" width="132" height="64" rx="10" fill="#f3eef8" stroke="#9b7bb6"/>
    <text x="708" y="29" text-anchor="middle" fill="#5a3f78" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">ship</text>
    <text x="708" y="48" text-anchor="middle" fill="#725889" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">commit &amp; PR</text>
