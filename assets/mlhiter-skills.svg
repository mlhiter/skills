  <path d="M70 508H1030" stroke="#cbd6d2" stroke-width="1.2"/>
  <text x="70" y="532" fill="#65727c" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">All entries are public-safe skill bundles under skills/&amp;lt;name&amp;gt;/SKILL.md.</text>
  <text x="850" y="532" fill="#65727c" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">Provenance is documented below.</text>
