    <circle cx="382" cy="-4" r="3.5" fill="#5a9fab"/>
    <text x="786" y="0" fill="#65727c" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400">14 skills, one public-safe source of truth.</text>
