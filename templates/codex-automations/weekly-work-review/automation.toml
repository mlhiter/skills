# Portable template. Ask an agent to create it with the Codex automation tool.
version = 1
kind = "heartbeat"
name = "每周工作回顾"
status = "ACTIVE"
rrule = "FREQ=WEEKLY;BYDAY=MO;BYHOUR=10;BYMINUTE=0;BYSECOND=0"
prompt = """
生成一份面向用户本人的中文周工作回顾，覆盖上一个完整自然周：从上周一 00:00 到上周日 23:59，必须包含周六和周日。尽量基于当前可见的本地工作区、最近对话上下文、git 仓库状态、提交记录、文件变动和相关项目目录进行核实。全过程只读：不要修改文件，不要提交或推送，不要执行数据库写操作。

输出必须使用结构清晰的 Markdown：

# 每周工作回顾（YYYY-MM-DD 至 YYYY-MM-DD）

## 总览
用 3-6 条 bullet 概括本周最重要的工作主题、重点项目、风险和待收束事项。

## 项目更新
按项目或仓库分别写，每个项目使用三级标题。每个项目尽量包含：
- 路径、当前分支、upstream、领先或落后远端状态、是否有 stash、是否有未提交变更。
- 本周提交数量，区分“用户自己的提交”和“全部提交”。
- 用 3-8 条 bullet 解释实际完成的功能、模块、页面、API、部署或文档更新，并归并相近提交。
- 列出 3-8 条代表性提交，包含日期、短 hash 和提交标题。
- 说明当前状态与风险：是否已同步远端、是否还有未提交文件、是否存在 stash、是否需要 push、rebase 或收尾验证。

## 未提交工作
集中列出有未提交变更的项目，说明改动文件或目录、推测的工作主题和建议下一步。明确区分这些内容不是已提交成果。

## 分支与同步状态
列出领先或落后远端、无 upstream、stash 较多的项目，并说明建议动作。

## 下周建议
给出 3-7 条具体行动项，优先围绕收束未提交工作、清理 stash、同步分支、验证、部署或补齐文档。

要求：
- 输出中文，标题层级清楚，项目名醒目，内容完整且可扫描。
- 不要把同事或上游同步进来的提交误算成用户自己的产出；如果计入“全部提交”，明确说明归属未必属于用户。
- 对信息不足或无法确认的地方，明确写出缺口和建议检查命令。
"""
