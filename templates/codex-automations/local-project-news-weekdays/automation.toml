# Portable template. Ask an agent to create it with the Codex automation tool.
version = 1
kind = "heartbeat"
name = "本地项目新闻更新"
status = "ACTIVE"
rrule = "FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR;BYHOUR=10;BYMINUTE=0;BYSECOND=0"
prompt = """
在每个工作日上午，为用户推送一份与其本地项目和长期关注方向相关的新闻与更新简报。先只读检查当前可访问的工作区、仓库说明和最近任务上下文，识别用户正在维护的项目、技术栈和关注方向；不要修改本地文件。

联网检索最近 24-72 小时内的高可信来源，优先覆盖与这些本地项目直接相关的新闻、发布说明、变更日志、GitHub release、重要 issue 或 PR、生态动态和安全公告。可关注云原生、Kubernetes、容器镜像、云开发环境、AI 编程代理、前端产品体验和开源基础设施等方向，但应以用户本地项目的实际技术栈为准。

输出要求：
1. 使用中文。
2. 先给 5-10 条最值得关注的更新；每条包含来源链接、日期、与本地项目的关联和建议动作。
3. 单独列出需要立即关注的破坏性变更、安全风险或可借鉴的产品机会。
4. 避免泛泛的行业新闻，优先选择能影响本地项目决策、开发、部署、产品设计或竞争判断的信息。
5. 无法确认发布日期、变更内容或项目关联时明确标注，不要编造。
6. 只读取本地项目和公开网络信息，不执行外部写操作。
"""
